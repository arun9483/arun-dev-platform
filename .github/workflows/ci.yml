# PR gate — thin consumer of frontend-platform-kit reusable workflows.
# Always pin to a tag (@v1), never @main: a bad main in platform-kit must not be
# able to break every consumer repo simultaneously.

name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: arun9483/frontend-platform-kit/.github/workflows/quality.yml@v1
    secrets: inherit

  security:
    uses: arun9483/frontend-platform-kit/.github/workflows/security.yml@v1

  performance:
    uses: arun9483/frontend-platform-kit/.github/workflows/performance.yml@v1
    with:
      routes: '/,/projects,/articles/react-server-components-deep-dive,/search'
      # Warn mode until 2026-07-12 (30 days from rollout), then flip to true.
      lighthouse-blocking: false
    secrets: inherit

  ux:
    uses: arun9483/frontend-platform-kit/.github/workflows/ux-regression.yml@v1
    permissions:
      contents: write
      issues: write
    with:
      e2e-args: '--project=chromium'
    secrets: inherit
