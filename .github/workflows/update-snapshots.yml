# Label-triggered visual-baseline regeneration. Add the `update-snapshots` label
# to a PR and CI regenerates the Playwright screenshots inside the pinned Linux
# container and commits them to the PR branch. Baselines are NEVER generated on
# macOS — Linux font rendering is the single source of truth.

name: Update visual baselines

on:
  pull_request:
    types: [labeled]

jobs:
  update-snapshots:
    if: github.event.label.name == 'update-snapshots'
    uses: arun9483/frontend-platform-kit/.github/workflows/ux-regression.yml@v1
    permissions:
      contents: write
      issues: write
    with:
      update-snapshots: true
      e2e-args: '--project=chromium'
    secrets: inherit
