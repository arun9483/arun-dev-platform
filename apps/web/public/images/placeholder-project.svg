<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#6366f1" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="750" y1="0" x2="750" y2="480"/>
    <line x1="900" y1="0" x2="900" y2="480"/>
    <line x1="1050" y1="0" x2="1050" y2="480"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="960" cy="100" r="180" fill="#4f46e5" fill-opacity="0.12"/>
  <circle cx="200" cy="380" r="120" fill="#6366f1" fill-opacity="0.1"/>

  <!-- Code bracket decoration -->
  <text x="80" y="280" font-family="monospace" font-size="120" fill="#6366f1" fill-opacity="0.15" font-weight="bold">{}</text>

  <!-- Icon circle -->
  <circle cx="600" cy="180" r="44" fill="#4f46e5" fill-opacity="0.35"/>
  <circle cx="600" cy="180" r="44" stroke="#818cf8" stroke-width="1.5" fill="none"/>
  <!-- Folder icon simplified -->
  <rect x="578" y="168" width="44" height="30" rx="3" fill="none" stroke="#a5b4fc" stroke-width="2"/>
  <path d="M578 172 L590 172 L594 168 L622 168" stroke="#a5b4fc" stroke-width="2" fill="none"/>

  <!-- Label -->
  <text x="600" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle" letter-spacing="3" font-weight="500">PROJECT COVER</text>

  <!-- Accent line -->
  <rect x="560" y="275" width="80" height="2" rx="1" fill="#6366f1" fill-opacity="0.6"/>

  <!-- Bottom status bar -->
  <rect x="0" y="440" width="1200" height="40" fill="#000" fill-opacity="0.25"/>
  <circle cx="40" cy="460" r="5" fill="#4ade80"/>
  <text x="56" y="464" font-family="monospace" font-size="11" fill="#94a3b8">image placeholder — replace with actual screenshot or design</text>
</svg>
