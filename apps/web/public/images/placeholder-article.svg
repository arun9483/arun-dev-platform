<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- Horizontal accent lines (scanline feel) -->
  <g stroke="#334155" stroke-opacity="0.5" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
  </g>

  <!-- Decorative text lines (simulating article content) -->
  <rect x="80" y="180" width="300" height="10" rx="2" fill="#334155"/>
  <rect x="80" y="200" width="240" height="10" rx="2" fill="#1e293b"/>
  <rect x="80" y="220" width="280" height="10" rx="2" fill="#1e293b"/>
  <rect x="80" y="248" width="200" height="10" rx="2" fill="#1e293b"/>
  <rect x="80" y="268" width="260" height="10" rx="2" fill="#1e293b"/>

  <!-- Right: code block mockup -->
  <rect x="700" y="140" width="420" height="200" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Code block header -->
  <rect x="700" y="140" width="420" height="36" rx="8" fill="#1e293b"/>
  <rect x="700" y="158" width="420" height="18" fill="#1e293b"/>
  <circle cx="724" cy="158" r="5" fill="#ef4444" fill-opacity="0.7"/>
  <circle cx="742" cy="158" r="5" fill="#f59e0b" fill-opacity="0.7"/>
  <circle cx="760" cy="158" r="5" fill="#22c55e" fill-opacity="0.7"/>
  <text x="820" y="162" font-family="monospace" font-size="10" fill="#64748b">typescript</text>
  <!-- Code lines -->
  <rect x="720" y="192" width="60" height="8" rx="2" fill="#c792ea" fill-opacity="0.7"/>
  <rect x="786" y="192" width="40" height="8" rx="2" fill="#a5b4fc" fill-opacity="0.7"/>
  <rect x="720" y="210" width="30" height="8" rx="2" fill="#89ddff" fill-opacity="0.7"/>
  <rect x="756" y="210" width="80" height="8" rx="2" fill="#eeffff" fill-opacity="0.6"/>
  <rect x="720" y="228" width="50" height="8" rx="2" fill="#c3e88d" fill-opacity="0.7"/>
  <rect x="776" y="228" width="60" height="8" rx="2" fill="#a5b4fc" fill-opacity="0.6"/>
  <rect x="720" y="246" width="40" height="8" rx="2" fill="#89ddff" fill-opacity="0.7"/>
  <rect x="766" y="246" width="70" height="8" rx="2" fill="#eeffff" fill-opacity="0.5"/>
  <rect x="720" y="264" width="30" height="8" rx="2" fill="#c792ea" fill-opacity="0.7"/>
  <rect x="720" y="298" width="100" height="8" rx="2" fill="#546e7a" fill-opacity="0.8"/>

  <!-- Label -->
  <text x="600" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#475569" text-anchor="middle" letter-spacing="3" font-weight="500">ARTICLE COVER IMAGE</text>
  <rect x="540" y="440" width="120" height="2" rx="1" fill="#334155"/>

  <!-- Bottom status bar -->
  <rect x="0" y="454" width="1200" height="26" fill="#000" fill-opacity="0.3"/>
  <circle cx="20" cy="467" r="4" fill="#4ade80"/>
  <text x="34" y="471" font-family="monospace" font-size="10" fill="#475569">image placeholder — replace with actual article cover image</text>
</svg>
